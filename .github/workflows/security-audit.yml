name: 🛡️ BomberCyber DevSecOps Security Audit

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  security-quality-gate:
    name: Esquadrão DevSecOps Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Instalar Dependências
        run: npm install

      - name: 🧪 Executar Suítes de Segurança DAST (Vitest)
        run: npm test

      - name: 🕵️ Executar Auditoria Multi-Agente & Quality Gate
        run: npm run security:audit
        env:
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET || 'ci-pipeline-mock-secret-key-32-chars-min' }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || 'ci-pipeline-mock-secret-key-32-chars-min' }}
